name: Temporary exact OcuPathIF 0.991.1 public draft transfer

on:
  push:
    branches:
      - release/0991-two-leg-feed-20260810
    paths:
      - .github/workflows/attach-public-assets-09911-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RELEASE_ID: '369530281'
      RELEASE_TAG: v0.991.1-c801
      MAC_URL: https://ocupathif-downloads-hk-1466317075.cos.ap-hongkong.myqcloud.com/OcupathIF-0.991.1-arm64-mac-standalone.zip
      MAC_BYTES: '1318746948'
      MAC_SHA256: c18c0d29158f8c24ea8e7861dba52100581dde5e10af3600a8d5127452364009
      WIN_URL: https://ocupathif-downloads-hk-1466317075.cos.ap-hongkong.myqcloud.com/OcupathIF-Setup-0.991.1-x64.exe
      WIN_BYTES: '1354650736'
      WIN_SHA256: 3db8fcd6deabbc55e2b37c6e086234bf448d536392703e5700e83ca4803091ac
      UPDATER_URL: https://ocupathif-downloads-hk-1466317075.cos.ap-hongkong.myqcloud.com/OcupathIF-0.991.1-arm64-mac.zip
      UPDATER_BYTES: '1313793497'
      UPDATER_SHA256: 7acb800aea86d9675078b0497956c905a213544bb95f6229623de52b7d521162
      BLOCKMAP_URL: https://ocupathif-downloads-hk-1466317075.cos.ap-hongkong.myqcloud.com/OcupathIF-0.991.1-arm64-mac.zip.blockmap
      BLOCKMAP_BYTES: '1362071'
      BLOCKMAP_SHA256: e4f027c422a395dd3f88a4562bdd3124df617452fee163f554a6e6240b4e7d10
    steps:
      - name: Wait for both exact COS customer objects
        shell: bash
        run: |
          set -euo pipefail
          remote_length() {
            curl --fail --silent --show-error --location --head --max-time 30 "$1" \
              | tr -d '\r' \
              | awk 'tolower($1) == "content-length:" { print $2 }' \
              | tail -n 1
          }

          for attempt in $(seq 1 240); do
            mac_remote_bytes="$(remote_length "$MAC_URL" || true)"
            win_remote_bytes="$(remote_length "$WIN_URL" || true)"
            updater_remote_bytes="$(remote_length "$UPDATER_URL" || true)"
            blockmap_remote_bytes="$(remote_length "$BLOCKMAP_URL" || true)"
            if [[ "$mac_remote_bytes" == "$MAC_BYTES" \
              && "$win_remote_bytes" == "$WIN_BYTES" \
              && "$updater_remote_bytes" == "$UPDATER_BYTES" \
              && "$blockmap_remote_bytes" == "$BLOCKMAP_BYTES" ]]; then
              printf 'All four COS objects reached final lengths on attempt %s.\n' "$attempt"
              exit 0
            fi
            printf 'Waiting for final COS objects (attempt %s/240): Mac=%s Windows=%s Updater=%s Blockmap=%s\n' \
              "$attempt" \
              "${mac_remote_bytes:-unavailable}" \
              "${win_remote_bytes:-unavailable}" \
              "${updater_remote_bytes:-unavailable}" \
              "${blockmap_remote_bytes:-unavailable}"
            sleep 30
          done

          printf 'Timed out waiting for exact COS object lengths.\n' >&2
          exit 2

      - name: Download and verify exact c801 customer assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output OcupathIF-0.991.1-arm64-mac-standalone.zip "$MAC_URL"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output OcupathIF-Setup-0.991.1-x64.exe "$WIN_URL"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output OcupathIF-0.991.1-arm64-mac.zip "$UPDATER_URL"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output OcupathIF-0.991.1-arm64-mac.zip.blockmap "$BLOCKMAP_URL"

          test "$(stat -c '%s' OcupathIF-0.991.1-arm64-mac-standalone.zip)" = "$MAC_BYTES"
          test "$(stat -c '%s' OcupathIF-Setup-0.991.1-x64.exe)" = "$WIN_BYTES"
          test "$(stat -c '%s' OcupathIF-0.991.1-arm64-mac.zip)" = "$UPDATER_BYTES"
          test "$(stat -c '%s' OcupathIF-0.991.1-arm64-mac.zip.blockmap)" = "$BLOCKMAP_BYTES"
          printf '%s  %s\n' "$MAC_SHA256" OcupathIF-0.991.1-arm64-mac-standalone.zip | sha256sum --check --strict
          printf '%s  %s\n' "$WIN_SHA256" OcupathIF-Setup-0.991.1-x64.exe | sha256sum --check --strict
          printf '%s  %s\n' "$UPDATER_SHA256" OcupathIF-0.991.1-arm64-mac.zip | sha256sum --check --strict
          printf '%s  %s\n' "$BLOCKMAP_SHA256" OcupathIF-0.991.1-arm64-mac.zip.blockmap | sha256sum --check --strict

      - name: Replace only the exact assets in the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.draft' <<<"$before")" = true
          test "$(jq -r '.tag_name' <<<"$before")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$before")" = release/0991-two-leg-feed-20260810
          test "$(jq -r '.body == null' <<<"$before")" = true
          test -z "$(jq -r '.assets[] | select(.state != "uploaded") | .name' <<<"$before")"

          old_tag_before="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.991.1" --jq '.object.sha')"
          new_tag_before="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          test "$old_tag_before" = cc725456baec9d31d8c8a80e65a6e1eea41a3871
          test -z "$new_tag_before"

          cleanup_invalid_targets() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(
                (.name == \"OcupathIF-0.991.1-arm64-mac-standalone.zip\" and
                  (.state != \"uploaded\" or .size != 1318746948 or .digest != \"sha256:c18c0d29158f8c24ea8e7861dba52100581dde5e10af3600a8d5127452364009\")) or
                (.name == \"OcupathIF-Setup-0.991.1-x64.exe\" and
                  (.state != \"uploaded\" or .size != 1354650736 or .digest != \"sha256:3db8fcd6deabbc55e2b37c6e086234bf448d536392703e5700e83ca4803091ac\"))
              ) | .id" \
              | while read -r asset_id; do
                  [[ -z "$asset_id" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                done
          }
          trap 'status=$?; trap - EXIT; if [[ $status -ne 0 ]]; then cleanup_invalid_targets; fi; exit $status' EXIT

          remove_existing_asset() {
            local name="$1"
            jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$before" \
              | while read -r asset_id; do
                  [[ -z "$asset_id" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                done
          }
          upload_asset() {
            local path="$1"
            local content_type="$2"
            gh api \
              --hostname uploads.github.com \
              --method POST \
              -H "Content-Type: $content_type" \
              --input "$path" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$path")" \
              >/dev/null
          }

          remove_existing_asset OcupathIF-Setup-0.991.1-x64.exe
          remove_existing_asset OcupathIF-0.991.1-arm64-mac-standalone.zip
          upload_asset OcupathIF-Setup-0.991.1-x64.exe application/octet-stream
          upload_asset OcupathIF-0.991.1-arm64-mac-standalone.zip application/zip

          after="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          old_tag_after="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.991.1" --jq '.object.sha')"
          new_tag_after="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          test "$old_tag_after" = "$old_tag_before"
          test "$new_tag_after" = "$new_tag_before"
          test "$(jq -r '.draft' <<<"$after")" = true
          test "$(jq -r '.body == null' <<<"$after")" = true
          test "$(jq -r '.assets[] | select(.name == "OcupathIF-0.991.1-arm64-mac-standalone.zip") | [.size,.digest,.state] | @tsv' <<<"$after")" = $'1318746948\tsha256:c18c0d29158f8c24ea8e7861dba52100581dde5e10af3600a8d5127452364009\tuploaded'
          test "$(jq -r '.assets[] | select(.name == "OcupathIF-Setup-0.991.1-x64.exe") | [.size,.digest,.state] | @tsv' <<<"$after")" = $'1354650736\tsha256:3db8fcd6deabbc55e2b37c6e086234bf448d536392703e5700e83ca4803091ac\tuploaded'
          test "$(jq -r '.assets[] | select(.name == "OcuPathIF_v0.991.1_User_Guide_en.pdf") | [.size,.digest,.state] | @tsv' <<<"$after")" = $'2259757\tsha256:7382634b07486eb0c7439c1e6ed8fd20182a856faeb45f948fb364fffdac23dc\tuploaded'
          test "$(jq -r '.assets[] | select(.name == "OcuPathIF_v0.991.1_User_Guide_zh.pdf") | [.size,.digest,.state] | @tsv' <<<"$after")" = $'2546526\tsha256:97550c86147300606f5744a648b8c85b15fa4f0937628a14cfc2ae716489581c\tuploaded'

          jq '{draft,tag_name,target_commitish,body,assets:[.assets[]|{name,size,digest,state}]}' <<<"$after"
