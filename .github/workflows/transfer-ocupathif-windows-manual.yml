name: Transfer OcuPathIF Windows manual asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact source-free handoff package
        env:
          TRANSFER_URL: ${{ secrets.OCUPATH_WINDOWS_TRANSFER_URL }}
        run: |
          test -n "$TRANSFER_URL"
          curl --fail --location --retry 3 --retry-all-errors \
            --output OcupathIF_v0.99.1_win.zip "$TRANSFER_URL"
          echo "01c1e568e54c75db32d5fdfd7857886e6cc532b3d26d992762bd2c2763cd0c8a  OcupathIF_v0.99.1_win.zip" | sha256sum --check --strict
          test "$(stat --format=%s OcupathIF_v0.99.1_win.zip)" = "1354880805"

      - name: Extract and verify exact installer
        run: |
          unzip -j OcupathIF_v0.99.1_win.zip OcupathIF-Setup-0.99.1-x64.exe -d exact
          echo "f62a863a8eb75f94f13e4cf7a4cb96d52299ce3793013f41854fb950916cfa21  exact/OcupathIF-Setup-0.99.1-x64.exe" | sha256sum --check --strict
          test "$(stat --format=%s exact/OcupathIF-Setup-0.99.1-x64.exe)" = "1354645375"

      - name: Upload exact installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.99.1 exact/OcupathIF-Setup-0.99.1-x64.exe --repo "$GITHUB_REPOSITORY"
