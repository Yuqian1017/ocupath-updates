name: Verify OcuPathIF public manual assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download complete public assets
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output OcupathIF-0.99.1-arm64-mac.zip \
            https://github.com/Yuqian1017/ocupath-updates/releases/download/v0.99.1/OcupathIF-0.99.1-arm64-mac.zip
          curl --fail --location --retry 3 --retry-all-errors \
            --output OcupathIF-Setup-0.99.1-x64.exe \
            https://github.com/Yuqian1017/ocupath-updates/releases/download/v0.99.1/OcupathIF-Setup-0.99.1-x64.exe

      - name: Reconcile complete bytes
        run: |
          echo "03d44c0f28471187a47710116db4dcaf2561b38b5df3380566486767afa81dec  OcupathIF-0.99.1-arm64-mac.zip" | sha256sum --check --strict
          echo "f62a863a8eb75f94f13e4cf7a4cb96d52299ce3793013f41854fb950916cfa21  OcupathIF-Setup-0.99.1-x64.exe" | sha256sum --check --strict
          test "$(stat --format=%s OcupathIF-0.99.1-arm64-mac.zip)" = "1314515661"
          test "$(stat --format=%s OcupathIF-Setup-0.99.1-x64.exe)" = "1354645375"

      - name: Parse downloaded package containers
        run: |
          unzip -t OcupathIF-0.99.1-arm64-mac.zip
          7z t OcupathIF-Setup-0.99.1-x64.exe
